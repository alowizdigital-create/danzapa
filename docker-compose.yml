# Danzapa : l'application Django, avec sa base SQLite dans un volume.
#
# Dokploy : Create Service → Compose, ce fichier (voir DEPLOIEMENT.md).
# Le volume nommé « danzapa-data » (en bas du fichier) est créé au premier
# déploiement puis conservé à chaque redéploiement : il contient la base
# /data/db.sqlite3 (chants, cultes, comptes), les images des thèmes et la clé
# secrète. Rien à configurer à part.
#
# Test sur un ordinateur :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#   → http://localhost:8000
services:
  web:
    build: .
    restart: unless-stopped
    # Variables de l'onglet Environment de Dokploy (fichier .env), facultatives.
    env_file:
      - path: .env
        required: false
    volumes:
      - danzapa-data:/data
    # Pas de « ports » : Dokploy relie le domaine au port 8000 du service web.
    expose:
      - "8000"

volumes:
  danzapa-data:
